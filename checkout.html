<!DOCTYPE html> 


<div id="checkoutQuote"></div>


<script>
  const quote = JSON.parse(sessionStorage.getItem("quoteCheckout") || "null");
  const output = document.getElementById("checkoutQuote");

  if (!quote) {
    output.textContent = "No saved quote found. Please submit the quote form first.";
  } else {
    output.textContent =
      `${quote.quantity} copies · ${quote.product_size} · ${quote.email}`;
  }
</script>
